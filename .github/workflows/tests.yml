name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: engine, stats, analytics tools, newsroom checks (offline: no Azure credentials, the newsroom uses its scripted client)
        run: |
          python tests/test_sim.py
          python tests/test_stats.py
          python tests/test_tools.py
          python tests/test_newsroom.py
