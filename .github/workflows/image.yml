name: image
# builds the server image on every push to main and publishes it to GitHub Container Registry; infra/deploy.ps1 runs it on Azure Container Apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nano-233/matchday-newsroom:latest
            ghcr.io/nano-233/matchday-newsroom:${{ github.sha }}
