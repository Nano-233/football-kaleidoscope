<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchday Newsroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Matchday Newsroom</div>
  <label class="match-pick"><span class="visually-hidden">Match</span><select id="match"></select></label>
  <nav class="seg" id="persona" role="tablist" aria-label="View">
    <button role="tab" data-p="fan" aria-selected="true">Fan</button>
    <button role="tab" data-p="analyst" aria-selected="false">Analyst</button>
    <button role="tab" data-p="scout" aria-selected="false">Scout</button>
  </nav>
  <label class="match-pick" title="Your club: answers are told from its side"><span class="visually-hidden">Your club</span><select id="club"></select></label>
  <label class="match-pick" title="Language for commentary, recaps and answers"><span class="visually-hidden">Language</span><select id="lang"></select></label>
  <span class="synthetic" title="Every club, player and match here is generated by the simulator">Synthetic data</span>
</header>

<section class="scoreboard" aria-live="polite">
  <div class="team home"><span class="code" id="h-code"></span><span class="name" id="h-name"></span></div>
  <div class="score"><span id="h-score">0</span><span class="dash">–</span><span id="a-score">0</span></div>
  <div class="team away"><span class="name" id="a-name"></span><span class="code" id="a-code"></span></div>
  <div class="clock"><span id="clock">0'</span><span id="period"></span></div>
</section>

<main class="layout">
  <section class="stage">
    <div class="pitch-wrap">
      <canvas id="pitch" width="1100" height="720" aria-label="Match replay"></canvas>
      <div class="reel-tag" id="reel" hidden></div>
      <div class="bd-box" id="bd" hidden><span class="lt-kind" id="bd-kind"></span><p id="bd-cap"></p>
        <div class="bar"><button class="btn" id="bd-next">Next</button><button class="btn" id="bd-exit">Exit</button></div></div>
      <div class="pitch-tip" id="pitch-tip" hidden></div>
      <div class="lower-third" id="overlay" hidden><span class="lt-kind" id="lt-kind"></span><p id="lt-line"></p></div>
      <div class="loading" id="loading">Loading match…</div>
    </div>
    <div class="transport">
      <button class="icon-btn" id="play" aria-label="Play"><svg viewBox="0 0 16 16"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg></button>
      <button class="text-btn" id="next" title="Next key moment (N)">Next moment</button>
      <button class="text-btn" id="voice" aria-pressed="false" title="Read the commentary out loud">Voice</button>
      <label class="speed">Speed
        <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="10">10×</option><option value="30">30×</option></select>
      </label>
      <div class="timeline" id="timeline">
        <div class="tl-clip" id="tl-clip" hidden></div>
        <div class="tl-marks" id="tl-marks"></div>
        <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Match time">
      </div>
    </div>
  </section>

  <aside class="panel" id="panel">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
