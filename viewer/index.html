<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Viewer</title>
<style>
  :root{color-scheme:dark;--bg:#0f1720;--fg:#e8eef5;--mut:#8aa0b4;--home:#3b82f6;--away:#ef4444}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
  #bar{display:flex;gap:12px;align-items:center;padding:8px 16px;flex-wrap:wrap;width:100%;box-sizing:border-box;max-width:1100px}
  #score{font-size:20px;font-weight:700;min-width:240px}
  input[type=range]{flex:1;min-width:200px}
  canvas{width:min(calc(100% - 32px),calc((100vh - 170px) * 1.528),1100px);height:auto;aspect-ratio:1100/720;background:#1b6b3a;display:block;margin-inline:16px}
  #log{width:100%;max-width:1100px;box-sizing:border-box;padding:8px 16px;color:var(--mut);font-size:12px;height:90px;overflow:hidden}
  button,select{background:#22303f;color:var(--fg);border:1px solid #33475c;border-radius:6px;padding:4px 10px}
</style></head><body>
<div id="bar">
  <span id="score">loading match…</span>
  <button id="play">Play</button><button id="next" title="jump to the next key moment (n)">Next moment ⏭</button>
  <select id="speed"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>30</option><option>60</option><option>120</option></select>x
  <input id="seek" type="range" min="0" max="1" step="0.1" value="0">
  <span id="clock"></span>
</div>
<canvas id="c" width="1100" height="720"></canvas>
<div id="tip" style="position:fixed;display:none;background:#0b1118;border:1px solid #33475c;border-radius:6px;padding:6px 8px;font-size:12px;pointer-events:none;max-width:260px"></div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id), cv = $('c'), g = cv.getContext('2d');
const L = 105, W = 68, PAD = 30, SX = (cv.width - 2*PAD)/L, SY = (cv.height - 2*PAD)/W;
const px = x => PAD + x*SX, py = y => PAD + y*SY;
let D, frames, dt, t = 0, playing = false, last = 0, names = {}, info = {}, slots = [], mouse = null;
const src = new URLSearchParams(location.search).get('src') || '../out/match_1.json';
(window.__EMBED__ ? Promise.resolve(window.__EMBED__()) : fetch(src).then(r => r.json())).catch(err => { $('score').textContent = 'Could not load the match: ' + err; throw err; }).then(d => {
  D = d; frames = d.frames; dt = d.meta.dt;
  [...d.meta.home.players, ...d.meta.away.players, ...d.meta.home.bench, ...d.meta.away.bench].forEach(p => { names[p.id] = p; info[p.id] = p; });
  slots = [...d.meta.home.players, ...d.meta.away.players];
  $('seek').max = d.meta.duration; draw();
});
function pitch(){
  g.fillStyle = '#1b6b3a'; g.fillRect(0,0,cv.width,cv.height);
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
  g.strokeRect(px(0),py(0),L*SX,W*SY);
  g.beginPath(); g.moveTo(px(L/2),py(0)); g.lineTo(px(L/2),py(W)); g.stroke();
  g.beginPath(); g.arc(px(L/2),py(W/2),9.15*SX,0,7); g.stroke();
  for (const s of [0,1]) { const x = s ? L : 0, d = s ? -1 : 1;
    g.strokeRect(px(s ? L-16.5 : 0),py(W/2-20.16),16.5*SX,40.32*SY);
    g.strokeRect(px(s ? L-5.5 : 0),py(W/2-9.16),5.5*SX,18.32*SY);
    g.strokeRect(px(s ? L : -2),py(W/2-3.66),2*SX,7.32*SY); }
}
function who(k){ let p = slots[k]; for (const e of D.events) { if (e.t > t) break; if ((e.type === 'substitution' || e.type === 'outfield_keeper') && e.slot === k) p = info[e.on] || p; } return p; }
function draw(){
  if (!D) return;
  const i = Math.min(frames.length-1, Math.max(0, Math.round(t/dt))), f = frames[i];
  pitch();
  const carrier = f[3];
  for (let k = 0; k < 22; k++) {
    if (f[6+2*k] < -5) continue;  // sent off
    const x = px(f[5+2*k]), y = py(f[6+2*k]), home = k < 11;
    g.beginPath(); g.arc(x,y,9,0,7); g.fillStyle = home ? '#3b82f6' : '#ef4444'; g.fill();
    g.lineWidth = k % 11 === 0 ? 3 : 1; g.strokeStyle = k % 11 === 0 ? '#facc15' : '#fff'; g.stroke();
    if (k === carrier) { g.beginPath(); g.arc(x,y,14,0,7); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = '#fff'; g.font = '10px sans-serif'; g.textAlign = 'center'; g.fillText(who(k).number, x, y+3.5);
  }
  g.beginPath(); g.arc(px(f[1]),py(f[2]),5,0,7); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 1.5; g.stroke();
  const ev = D.events.filter(e => e.t <= t);
  let h = 0, a = 0; ev.forEach(e => { if (e.type === 'goal') e.team ? a++ : h++; });
  $('score').textContent = `${D.meta.home.code} ${h} – ${a} ${D.meta.away.code}`;
  const m = Math.floor(t/60), s = Math.floor(t%60);
  $('clock').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const line = e => e.type === 'substitution' ? `${e.minute}' SUB ${D.meta[e.team ? 'away' : 'home'].code}: ${e.off_name} → ${e.on_name} (${e.reason})`
    : e.type === 'formation_change' ? `${e.minute}' FORMATION ${D.meta[e.team ? 'away' : 'home'].code}: ${e.previous} → ${e.formation} (${e.reason})`
    : e.type === 'tactic_change' ? `${e.minute}' TACTICS ${D.meta[e.team ? 'away' : 'home'].code}: ${e.reason}`
    : `${e.minute}' ${e.type}${e.player ? ' – '+(names[e.player]?.name||e.player) : ''}${e.outcome ? ' ('+e.outcome+')' : ''}${e.card ? ' '+e.card : ''}${e.xg ? ' xG '+e.xg.toFixed(2) : ''}`;
  $('log').innerHTML = ev.filter(e => !['pressure','carry','possession_change','take_on'].includes(e.type)).slice(-6).reverse().map(line).join('<br>');
  const tip = $('tip');
  if (mouse) { let best = -1, bd = 16; for (let k = 0; k < 22; k++) { const d = Math.hypot(px(f[5+2*k])-mouse[0], py(f[6+2*k])-mouse[1]); if (d < bd) { bd = d; best = k; } }
    if (best >= 0) { const p = who(best); tip.style.display = 'block'; tip.style.left = (mouse[2]+12)+'px'; tip.style.top = (mouse[3]+12)+'px';
      tip.innerHTML = `<b>${p.number} ${p.name}</b>${p.star ? ' ★' : ''}<br>${p.role} · rating ${p.overall}<br>${(p.traits||[]).join(', ') || 'no traits'}`; } else tip.style.display = 'none'; } else tip.style.display = 'none';
  $('seek').value = t;
}
function tick(now){
  if (playing) { t = Math.min(D.meta.duration, t + (now-last)/1000 * +$('speed').value); if (t >= D.meta.duration) playing = false; }
  last = now; draw(); requestAnimationFrame(tick);
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
const KEY = e => ['goal','own_goal','penalty','sent_off','var_check','goal_disallowed','substitution','formation_change','injury'].includes(e.type) || (e.type === 'shot' && e.xg > .15) || (e.type === 'card' && e.card !== 'yellow');
$('next').onclick = () => { const e = D.events.find(e => e.t > t + 1 && KEY(e)); if (e) { t = Math.max(0, e.t - 6); draw(); } };
document.onkeydown = e => { if (e.key === 'n') $('next').click(); if (e.key === ' ') { e.preventDefault(); $('play').click(); } };
$('seek').oninput = e => { t = +e.target.value; draw(); };
cv.onmousemove = e => { const r = cv.getBoundingClientRect(); mouse = [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height, e.clientX, e.clientY]; draw(); };
cv.onmouseleave = () => { mouse = null; draw(); };
requestAnimationFrame(tick);
</script></body></html>
